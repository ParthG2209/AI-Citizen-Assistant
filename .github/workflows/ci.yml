name: CI

on:
  push:
    branches: [master-work-1]
  pull_request:
  workflow_dispatch:
    inputs:
      run_slow:
        description: "Also run slow tests (real PaddleOCR / embeddings)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff pip-audit
      - name: Ruff
        run: ruff check backend ai_modules scripts
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit (core API)
        run: pip-audit -r backend/requirements.txt
      - name: Dependency audit (AI stack)
        run: pip-audit -r ai_modules/requirements.txt

  core-tests:
    # Backend API (PostgreSQL), rule engine, knowledge graph (Neo4j), recommendations, analytics endpoints.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aca
          POSTGRES_PASSWORD: aca_dev_password
          POSTGRES_DB: aca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aca -d aca" --health-interval 5s --health-timeout 3s --health-retries 20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/aca_dev_password
          NEO4J_server_memory_heap_max__size: 1g
        ports: ["7687:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1" --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://aca:aca_dev_password@localhost:5432/aca
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: aca_dev_password
      # Service-dependent tests must fail (not skip) in CI when PostgreSQL / Neo4j are unreachable.
      REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
      - name: Install
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          # pandas stack: analytics endpoint tests; langchain-core: imported by ai_modules.rag (prompt templates);
          # pymupdf + pillow: corrupt-PDF upload test uses the real document loader
          pip install "pandas>=2.2" "pyarrow>=16.0" "plotly>=5.22" "langchain-core>=0.3" "pymupdf>=1.24" "pillow>=10.0"
      - name: Migrations
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Tests
        run: >-
          python -m pytest -m "not slow"
          backend/tests ai_modules/rule_engine ai_modules/knowledge_graph ai_modules/recommendation

  docker-smoke:
    # Build the backend image and check it migrates, starts and reports ready against PostgreSQL.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start PostgreSQL + backend
        run: docker compose --profile app up -d --build postgres backend
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/ready; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs backend
          exit 1
      - name: Smoke requests
        run: |
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:8000/api/v1/schemes | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d) >= 1, d; print(len(d), 'schemes')"
      - name: Tear down
        if: always()
        run: docker compose --profile app down -v

  analytics-tests:
    # Pandas + PySpark engines (parity), synthetic data generator, exports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install "pyspark>=3.5,<4.1" "pandas>=2.2" "pyarrow>=16.0" "plotly>=5.22"
      - name: Tests
        run: python -m pytest ai_modules/analytics
      - name: Pipeline smoke run
        run: python scripts/run_district_analytics.py --engine pandas

  ai-tests:
    # OCR + RAG. Fast tests always; slow tests (real models) on manual dispatch.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ai_modules/requirements.txt
      - name: System packages (OpenCV runtime, Devanagari font)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 fonts-noto-core
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r ai_modules/requirements.txt
      - name: Fast tests
        run: python -m pytest -m "not slow" ai_modules/ocr ai_modules/rag
      - name: Slow tests (real PaddleOCR / embeddings)
        if: github.event_name == 'workflow_dispatch' && inputs.run_slow
        run: python -m pytest -m "slow and not integration" ai_modules/ocr ai_modules/rag
