# Mukhyamantri Kisan Kalyan Yojana (Madhya Pradesh state top-up to PM-KISAN).
# Official source: CM Helpline scheme register entry 606 (Revenue Department), updated 28-08-2024.
scheme_id: mp_kisan_kalyan
version: "2024.1"
name: Mukhyamantri Kisan Kalyan Yojana
level: state
state: Madhya Pradesh
department: Revenue Department, Government of Madhya Pradesh
effective_from: 2024-08-28
verification_status: partially_verified
sources:
  - title: Mukhyamantri Kisan Kalyan Yojana - scheme entitlement page (Scheme ID 606), updated 28-08-2024
    url: https://cmhelpline.mp.gov.in/Schmedetail.aspx?Schemeid=606
    publisher: Revenue Department, Government of Madhya Pradesh (CM Helpline)
    accessed_on: 2026-11-18
    section: Eligibility ("PM-KISAN eligibility conditions apply", para 2.4.1 exclusions), benefit, application
  - title: PM-KISAN Operational Guidelines (revised as on 29.03.2020)
    url: https://pmkisan.gov.in/Documents/RevisedPM-KISANOperationalGuidelines(English).pdf
    publisher: Department of Agriculture and Farmers Welfare, Government of India
    accessed_on: 2026-11-18
    section: Para 3 and 4.1 (applied by the state scheme)
benefit:
  type: recurring_cash
  description: >-
    INR 6,000 per year in three equal instalments (April-July, August-November, December-March), paid by the
    State in addition to the INR 6,000 PM-KISAN benefit.
  amount_inr: 6000
  frequency: annual
  is_cash: true
required_documents:
  - land_record
conditions:
  - id: mp_resident
    description: Farmer is a resident of Madhya Pradesh
    field: domicile_state
    operator: eq
    value: Madhya Pradesh
    resolves_with: [samagra_domicile]
    source_ref: CM Helpline scheme 606 (state scheme of the MP Revenue Department for MP landholding farmers)
  - id: owns_cultivable_land
    description: Farmer family owns cultivable land as per land records
    field: family_owns_cultivable_land
    operator: is_true
    resolves_with: [land_record]
    source_ref: CM Helpline scheme 606 (beneficiary class "bhumidhari krishak"; PM-KISAN conditions apply)
  - id: no_income_tax_payer
    description: No family member paid income tax in the last assessment year
    field: family_member_income_tax_payer
    operator: is_false
    source_ref: CM Helpline scheme 606 para 2.4.1; PM-KISAN guidelines para 4.1(b)(v)
  - id: no_government_employee_in_family
    description: No family member is a serving or retired government employee (Group D / Class IV excepted)
    field: family_member_government_employee
    operator: is_false
    failure_message: Multi Tasking Staff / Class IV / Group D employees are not excluded - verify offline.
    source_ref: CM Helpline scheme 606 para 2.4.1; PM-KISAN guidelines para 4.1(b)(iii)
  - id: applicant_not_government_employee
    description: Applicant is not a government employee
    field: occupation
    operator: ne
    value: government_employee
    failure_message: Multi Tasking Staff / Class IV / Group D employees are not excluded - verify offline.
    source_ref: CM Helpline scheme 606 para 2.4.1; PM-KISAN guidelines para 4.1(b)(iii)
  - id: no_pensioner_above_10k
    description: No family member is a retired pensioner drawing INR 10,000 or more per month
    field: family_member_pensioner_above_10k
    operator: is_false
    source_ref: CM Helpline scheme 606 para 2.4.1; PM-KISAN guidelines para 4.1(b)(iv)
relationships:
  - scheme_id: pm_kisan
    relation: TOPS_UP
    reason: >-
      The MP Revenue Department page states that PM-KISAN eligibility conditions apply and that farmers continue
      to receive the PM-KISAN INR 6,000 per year in addition to this scheme's INR 6,000 per year.
    source_url: https://cmhelpline.mp.gov.in/Schmedetail.aspx?Schemeid=606
limitations:
  - >-
    Partially verified: the official page is a CM Helpline scheme register entry, not the government order; the
    date on which the benefit was raised from INR 4,000 (2020 launch) to INR 6,000 was not found, so this
    version is dated from the page update (28-08-2024).
  - Being a registered PM-KISAN beneficiary with completed eKYC is required in practice but is not checked.
  - All PM-KISAN limitations apply (Group D carve-out, constitutional posts, professionals, NRIs, land cut-off).
  - Whether a Samagra ID is mandatory was not confirmed from an official source.
application_steps:
  - Eligible PM-KISAN beneficiaries apply through the concerned Patwari (CM Helpline scheme 606).
  - Payment is released by the State through a single-click transfer; status is available on https://saara.mp.gov.in/.
