# Official public documents used as RAG evidence (real data; nothing in this list is synthetic).
#
# Every url must be https on an official government host: *.gov.in / *.nic.in, or the allow-listed official
# portals sansad.in (Parliament of India) and educationportal3.in (MP School Education Department).
# Downloads are stored next to this file as <doc_id>.<format> and are gitignored.
#
# sha256 semantics (pinned with `python scripts/build_vector_index.py --pin-hashes`):
#   format: pdf  -> sha256 of the downloaded PDF bytes
#   format: html -> sha256 of the extracted page text between content_start and content_end
#                   (portal markup contains per-request tokens, so raw HTML bytes never repeat)
# A mismatch stops the build: the official document changed and must be reviewed before re-pinning.
#
# Official documents that were found but are NOT indexed:
#   - MP BC Welfare "Rules for Post Matric Scholarship" (bcwelfare.mp.gov.in/Public/RulesforPostMatricsScholarship.pdf):
#     scanned images, no text layer (and the host serves an expired TLS certificate)
#   - MMVY Consolidated_Order_Latest_2026.pdf, MMVY_order.pdf, Government_Order_Corrigendum6.pdf
#     (medhavikalyan.mp.gov.in): scanned images, no text layer
#   - MMVY FAQ and procedure letters (medhavikalyan.mp.gov.in): legacy non-Unicode Hindi fonts -> unreadable text
#   - Awas_Sahayata_New_Rule_2016.pdf (hescholarship.mp.gov.in): scanned images, no text layer
#   - NSP PMS-OBC guidelines (scholarships.gov.in/public/schemeGuidelines/3069_G.pdf): TLS chain ends in a root
#     that the Windows trust store does not trust
#   - nha.gov.in senior-citizen FAQ PDF: the URL returns an HTML page instead of the PDF
#   - newsonair.gov.in laptop article: HTTP 403 for automated clients; mpinfo.org news: content is rendered by
#     JavaScript (no text in the HTML)
#   - khargone.nic.in "Laptop supply scheme": dated 2013-14 (80% threshold), superseded by the current 75% rule
