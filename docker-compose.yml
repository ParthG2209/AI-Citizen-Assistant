# Local development stack for AI Citizen Assistant.
#   docker compose up -d postgres neo4j          # databases only (recommended on 8 GB RAM)
#   docker compose --profile app up -d --build   # + FastAPI backend container
#   docker compose --profile llm up -d ollama    # + Ollama in Docker (skip if Ollama runs natively)
name: ai-citizen-assistant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aca_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aca}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aca} -d ${POSTGRES_DB:-aca}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aca_dev_password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1536m

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aca}:${POSTGRES_PASSWORD:-aca_dev_password}@postgres:5432/${POSTGRES_DB:-aca}
      NEO4J_URI: bolt://neo4j:7687
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  neo4jdata:
  ollama:
